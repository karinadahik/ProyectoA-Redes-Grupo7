
hostname interno
!
interface eth1
 ip address 10.7.0.2/30
!
interface eth2
 ip address 10.7.1.1/24
!
interface eth3
 ip address 10.7.2.1/24
!
router ospf
 ospf router-id 2.2.2.2
 network 10.7.0.0/30 area 0
 network 10.7.1.0/24 area 0
 network 10.7.2.0/24 area 0
 passive-interface default
 no passive-interface eth1
!
